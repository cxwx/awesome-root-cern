<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A curated list of awesome ROOT (CERN) libraries, tools, bindings, editor support, learning resources and data.">
  <meta name="color-scheme" content="light dark">
  <title>Awesome ROOT (CERN)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css" title="light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/dark.css" title="dark" disabled>
  <style>
    .theme-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 99;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      background: var(--theme-color, #42b983);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      opacity: .85;
    }
    .theme-toggle:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  <script>
    window.$docsify = {
      name: 'Awesome ROOT (CERN)',
      repo: 'cxwx/awesome-root-cern',
      homepage: 'README.md',
      loadSidebar: true,
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 3,
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/plugins/search.min.js"></script>
  <script>
    (() => {
      const light = document.querySelector('link[title="light"]');
      const dark = document.querySelector('link[title="dark"]');
      const btn = document.getElementById('theme-toggle');
      const apply = (t) => {
        light.disabled = t === 'dark';
        dark.disabled = t !== 'dark';
        btn.textContent = t === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', t);
      };
      apply(localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      btn.addEventListener('click', () => {
        apply(dark.disabled ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
